<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Configuration</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="config-page">
    <form id="config-form" class="config-form">
      <h1>Panel image</h1>
      <p class="hint">
        Displays an image fetched from a URL instead of an uploaded file —
        it updates automatically whenever the source changes, with no need
        to reconfigure the extension.
      </p>

      <label for="imageUrl">Image URL</label>
      <input
        type="url"
        id="imageUrl"
        name="imageUrl"
        placeholder="https://example.com/image.png"
        required
      />

      <label for="linkUrl">Click-through URL (optional)</label>
      <input type="url" id="linkUrl" name="linkUrl" placeholder="https://example.com" />

      <img id="preview" class="preview" alt="Preview" style="display: none" />

      <button type="submit">Save</button>
      <p id="status" class="status" role="status"></p>
    </form>

    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <script src="js/config.js"></script>
  </body>
</html>
