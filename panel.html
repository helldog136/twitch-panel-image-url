<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panel</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="panel-page">
    <a id="panel-link" class="panel-link" target="_blank" rel="noopener noreferrer" style="display: none">
      <img id="panel-image" class="panel-image" alt="" style="display: none" />
    </a>
    <div id="empty-state" class="empty-state">
      Not configured yet — set the image URL from the Twitch dashboard
      (Extensions → Configure).
    </div>

    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <script src="js/panel.js"></script>
  </body>
</html>
